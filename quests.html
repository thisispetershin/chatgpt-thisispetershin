<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LifeOS Quest Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .hero { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .hero h1 { color: var(--bg); font-size: clamp(2rem, 5vw, 3.6rem); }
    .hero .muted { color: color-mix(in srgb, var(--bg) 60%, transparent); }
    .hero .bar { background: color-mix(in srgb, var(--bg) 18%, transparent); height: 14px; }
    .hero .bar::after { background: repeating-linear-gradient(90deg, transparent 0 calc(5% - 2px), var(--ink) calc(5% - 2px) 5%); }
    .avatar { width: 112px; height: 112px; border-radius: 6px; display: grid; place-items: center; font-size: 3rem;
      background: var(--signal); color: var(--signal-ink); position: relative; border: 2px solid var(--signal); }
    .avatar .lv { position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); background: var(--bg); color: var(--ink); font: 800 .8rem/1 var(--f-display); padding: 6px 10px; border-radius: 3px; border: 2px solid var(--ink); white-space: nowrap; }
    @media (max-width: 520px) { .hero { grid-template-columns: 1fr; } .avatar { width: 84px; height: 84px; font-size: 2.2rem; } }
    .boss { position: relative; overflow: hidden; }
    .boss .icon { font-size: 2rem; width: 52px; height: 52px; display: grid; place-items: center; background: var(--surface-2); border-radius: 4px; flex: none; }
    .boss .hp { height: 16px; background: var(--surface-2); overflow: hidden; margin-top: 14px; position: relative; border: 2px solid var(--line); }
    .boss .hp::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), var(--surface) calc(10% - 2px) 10%); }
    .boss .hp span { display: block; height: 100%; background: var(--bad); transition: width .5s ease; }
    .boss.slain { background: var(--good-soft); }
    .boss.slain::after { content: 'DEFEATED'; position: absolute; top: 14px; right: -34px; transform: rotate(35deg); background: var(--good); color: #fff; font: 700 .65rem/1 var(--f-mono); letter-spacing: .1em; padding: 5px 40px; }
    .board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    @media (max-width: 860px) { .board { grid-template-columns: 1fr; } }
    .board > div { background: color-mix(in srgb, var(--surface-2) 60%, transparent); border: 2px dashed var(--hair); border-radius: 6px; padding: 12px; min-width: 0; }
    .col-h { display: flex; justify-content: space-between; align-items: center; font: 700 .95rem/1 var(--f-display); letter-spacing: -.02em; margin-bottom: 12px; }
    .qcard { background: var(--surface); border: 2px solid var(--line); border-top-width: 6px; border-radius: 6px; padding: 12px 14px; margin-bottom: 10px; transition: transform .12s, box-shadow .12s; }
    .qcard:hover { transform: translate(-2px, -2px); box-shadow: var(--pop); }
    .qcard.r-daily { border-top-color: var(--muted); } .qcard.r-week { border-top-color: var(--good); }
    .qcard.r-month { border-top-color: var(--accent); } .qcard.r-year { border-top-color: var(--signal); }
    .qcard.overdue { background: var(--bad-soft); }
    .qcard.done { opacity: .6; }
    .qcard.done .qt { text-decoration: line-through; }
    .qt { font-weight: 650; font-size: 1.02rem; }
    .map { overflow-x: auto; padding: 8px 0 4px; }
    .map svg { display: block; min-width: 640px; }
    .badge { display: inline-flex; flex-direction: column; align-items: center; width: 96px; text-align: center; font: 600 .62rem/1.3 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .badge .b { width: 60px; height: 60px; border-radius: 6px; display: grid; place-items: center; font-size: 1.6rem; background: var(--surface-2); filter: grayscale(1); opacity: .4; margin-bottom: 6px; border: 2px dashed var(--line); }
    .badge.on .b { filter: none; opacity: 1; background: var(--signal); border: 2px solid var(--line); box-shadow: 3px 3px 0 var(--line); }
    .badge.on { color: var(--text); }
    .burst { position: fixed; pointer-events: none; font-size: 1.4rem; z-index: 60; animation: fly 1s ease-out forwards; }
    @keyframes fly { to { transform: translate(var(--dx), var(--dy)) rotate(240deg); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .burst { display: none; } }
  </style>
</head>
<body>
<main>
  <!-- Player -->
  <section class="card hero" id="player"></section>

  <!-- Goal setup -->
  <section class="card" id="goalCard">
    <div class="card-head"><h2>The Quest Giver</h2><button class="btn-sm" id="toggleQ">Show / hide</button></div>
    <div id="questionnaire"></div>
  </section>

  <!-- Bosses -->
  <section>
    <div class="section-title"><div><h2>Bosses</h2><p class="muted small">Each goal is a boss. Finishing quests linked to it drains its HP.</p></div></div>
    <div class="grid g3" id="bosses"></div>
  </section>

  <!-- Map -->
  <section class="card">
    <div class="card-head"><h2>Quest map</h2><span class="small muted">Next 45 days</span></div>
    <div class="map" id="map"></div>
  </section>

  <!-- Board -->
  <section>
    <div class="section-title">
      <div><h2>Quest board</h2><p class="muted small">Small quests, clear deadlines. Overdue? Reschedule with one tap — no penalty.</p></div>
      <div class="row"><select id="filter" style="width:auto"><option value="">All horizons</option><option value="daily">Daily</option><option value="week">Week</option><option value="month">Month</option><option value="year">Year</option></select>
      <button class="btn-primary" id="addQuest">+ New quest</button></div>
    </div>
    <div class="board" id="board"></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>Achievements</h2></div>
    <div class="row" id="badges" style="gap:6px"></div>
  </section>
</main>
<script src="assets/app.js"></script>
<script src="assets/quests.js"></script>
</body>
</html>
