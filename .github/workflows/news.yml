name: News refresh (every 3 hours)

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours at :17 UTC (09:17, 12:17 … KST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch feeds
        run: python3 scripts/fetch_news.py
      - name: Commit if changed
        run: |
          git config user.name "lifeos-bot"
          git config user.email "lifeos-bot@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet || (git commit -m "chore: refresh news feed" && git pull --rebase -q && git push)
